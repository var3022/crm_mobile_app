name: crm_pro
description: "CRM Pro Field Sales - Comprehensive mobile CRM application for field sales teams."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  archive: ^3.6.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  web: ^1.1.2
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
